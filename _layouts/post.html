<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | Suresh Kurmi</title>

    <meta name="description"
          content="{{ page.excerpt | strip_html | truncate: 160 }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #243044;
            background: #ffffff;
            line-height: 1.75;
        }

        .header {
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 0;
        }

        .header-inner {
            width: min(1000px, 92%);
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 20px;
            font-weight: 750;
            color: #111827;
            text-decoration: none;
        }

        .back {
            font-size: 14px;
            color: #155eef;
            text-decoration: none;
        }

        .article {
            width: min(850px, 92%);
            margin: 70px auto;
        }

        .category {
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #155eef;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(38px, 5vw, 58px);
            line-height: 1.1;
            letter-spacing: -1.8px;
            color: #111827;
            margin: 0 0 18px;
        }

        .date {
            color: #667085;
            font-size: 14px;
            margin-bottom: 45px;
        }

        .content {
            font-size: 18px;
        }

        .content h2 {
            margin-top: 55px;
            margin-bottom: 18px;
            font-size: 30px;
            line-height: 1.25;
            color: #111827;
        }

        .content h3 {
            margin-top: 35px;
            font-size: 22px;
            color: #111827;
        }

        .content p {
            margin: 0 0 22px;
        }

        .content ul,
        .content ol {
            margin-bottom: 25px;
            padding-left: 28px;
        }

        .content li {
            margin-bottom: 8px;
        }

        .content blockquote {
            margin: 30px 0;
            padding: 15px 25px;
            border-left: 4px solid #155eef;
            background: #f8fafc;
            color: #526071;
        }

        .footer {
            margin-top: 80px;
            padding: 35px 0;
            border-top: 1px solid #e5e7eb;
            color: #667085;
            font-size: 14px;
        }

    </style>

</head>

<body>

<header class="header">

    <div class="header-inner">

        <a class="brand" href="/">
            Suresh Kurmi
        </a>

        <a class="back" href="/">
            ← Back to home
        </a>

    </div>

</header>


<main class="article">

    <div class="category">
        {% if page.categories %}
            {{ page.categories | first }}
        {% endif %}
    </div>

    <h1>
        {{ page.title }}
    </h1>

    <div class="date">
        {{ page.date | date: "%B %-d, %Y" }}
    </div>

    <div class="content">

        {{ content }}

    </div>

    <div class="footer">

        <strong>Suresh Kumar Kurmi</strong><br>

        Engineering Leadership · Linux Graphics ·
        GPU & Display · Open Source · AI

    </div>

</main>

</body>

</html>
